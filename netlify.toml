# Configuración de despliegue en Netlify para el sitio Next.js.
[build]
  # Netlify DB inyecta la cadena de conexión como NETLIFY_DB_URL (no
  # DATABASE_URL, que es lo único que sabe leer el CLI de Prisma), así que
  # se copia antes de correr las migraciones contra la base real.
  command = "export DATABASE_URL=$NETLIFY_DB_URL && npx prisma migrate deploy && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# Plugin oficial de Next.js (App Router, API routes, ISR).
[[plugins]]
  package = "@netlify/plugin-nextjs"
